name: Build wheels

# Manual only. Run on a branch to build and test wheels without publishing. Run on a tag named
# <major>.<minor>.<patch> (e.g. 0.12.1) to also publish them as a GitHub Release; the wheels
# are versioned <tag>+ydrive.
on:
  workflow_dispatch:

jobs:
  check-ref:
    runs-on: ubuntu-latest
    outputs:
      # Empty on branch runs, where setuptools_scm derives a dev version from git
      release-version: ${{ steps.version.outputs.release-version }}
    steps:
    - name: Check tag name
      id: version
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        if [[ ! "${GITHUB_REF_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Tag '${GITHUB_REF_NAME}' does not match <major>.<minor>.<patch>" >&2
          exit 1
        fi
        echo "release-version=${GITHUB_REF_NAME}+ydrive" | tee -a "$GITHUB_OUTPUT"

  build-extra:
    needs: check-ref
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        # Should include history since the last tag for setuptools_scm to work
        fetch-depth: 300
        fetch-tags: true

    - name: Set release version
      if: needs.check-ref.outputs.release-version != ''
      run: echo "SETUPTOOLS_SCM_PRETEND_VERSION=${{ needs.check-ref.outputs.release-version }}" | tee -a $GITHUB_ENV

    - name: Build Wheels
      run: |
        pip3 install build
        python3 -m build --sdist --wheel third_party/skymarshal --outdir ./dist
        python3 -m build --sdist --wheel gen/python --outdir ./dist

    - name: Upload Wheels
      uses: actions/upload-artifact@v7
      with:
        name: symforce-wheels-extra
        path: dist/*

  build-linux:
    needs: check-ref
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [cp312, cp313, cp314]

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        # Should include history since the last tag for setuptools_scm to work
        fetch-depth: 300
        fetch-tags: true

    - name: Set release version
      if: needs.check-ref.outputs.release-version != ''
      run: echo "SETUPTOOLS_SCM_PRETEND_VERSION=${{ needs.check-ref.outputs.release-version }}" | tee -a $GITHUB_ENV

    - run: python3 -m pip install setuptools_scm
    - run: echo "SYMFORCE_VERSION=$(python3 -m setuptools_scm)" | tee -a $GITHUB_ENV

    - name: Build wheels
      uses: pypa/cibuildwheel@v3.4.1
      env:
        CIBW_BUILD: ${{ matrix.python-version }}-manylinux_x86_64
        CIBW_ARCHS_LINUX: x86_64
        CIBW_BEFORE_BUILD: yum install -y gmp-devel git
        CIBW_ENVIRONMENT: SYMFORCE_REWRITE_LOCAL_DEPENDENCIES=$SYMFORCE_VERSION SYMFORCE_PYTHON_OVERRIDE=python
        # SETUPTOOLS_SCM_PRETEND_VERSION gives every package built in the container, including
        # the test builds below, the release version
        CIBW_ENVIRONMENT_PASS_LINUX: SYMFORCE_VERSION SETUPTOOLS_SCM_PRETEND_VERSION
        CIBW_BEFORE_TEST: >
          pip install build setuptools_scm &&
          python -m build --wheel {project}/third_party/skymarshal --outdir /tmp/wheel-test-dist &&
          python -m build --wheel {project}/gen/python --outdir /tmp/wheel-test-dist &&
          pip install /tmp/wheel-test-dist/*
        # Need to install prettier for typescript codegen
        CIBW_TEST_COMMAND: source {project}/.github/scripts/install_prettier.sh && python {project}/.github/scripts/run_wheel_tests.py {project}
        CIBW_TEST_EXTRAS: dev

    - name: Upload Wheels
      uses: actions/upload-artifact@v7
      with:
        name: symforce-wheels-linux-x86_64-${{ matrix.python-version }}
        path: wheelhouse/*.whl

  merge-wheel-artifacts:
    runs-on: ubuntu-latest
    needs:
      - build-extra
      - build-linux
    steps:
      - uses: actions/upload-artifact/merge@v7
        with:
          name: symforce-wheels
          delete-merged: true

  publish-release:
    if: needs.check-ref.outputs.release-version != ''
    needs:
    - check-ref
    - merge-wheel-artifacts
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v8
      with:
        name: symforce-wheels
        path: dist/

    - name: Check wheel versions
      run: |
        python3 - "${{ needs.check-ref.outputs.release-version }}" dist/*.whl <<'EOF'
        import sys
        import zipfile

        expected = sys.argv[1]
        mismatched = []
        for wheel_path in sys.argv[2:]:
            with zipfile.ZipFile(wheel_path) as wheel:
                metadata_name = next(n for n in wheel.namelist() if n.endswith(".dist-info/METADATA"))
                metadata = wheel.read(metadata_name).decode()
            version = next(line.split(":", 1)[1].strip() for line in metadata.splitlines() if line.startswith("Version:"))
            print(f"{wheel_path}: {version}")
            if version != expected:
                mismatched.append(wheel_path)
        if mismatched:
            sys.exit(f"Expected version {expected}, mismatched: {mismatched}")
        EOF

    # Fails if a release for this tag already exists, so a version is never published twice
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        gh release create "${GITHUB_REF_NAME}" dist/*.whl \
          --verify-tag \
          --title "${GITHUB_REF_NAME}" \
          --notes "SymForce wheels ${{ needs.check-ref.outputs.release-version }}, built from ${GITHUB_SHA}."
